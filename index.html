<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba iframe</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://www1.ussailing.org/Themes/bsussailing.css">
</head>
<body>
  <div class="container-fluid">

    <!-- Nav copied from https://www1.ussailing.org/calendar/ -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="https://www.ussailing.org">
        <img class="bslogo" src="https://www1.ussailing.org/Images/logo1.png" alt="US Sailing Home">
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item"><a class="nav-link" href="https://www1.ussailing.org/constituents/Organization/MyUS/MyUSEventsOrg.aspx">Add Events</a></li>
          <li class="nav-item"><a class="nav-link" href="https://www.ussailing.org/competition/championships">U.S. Natl Championships &amp; Qualifiers</a></li>
          <li class="nav-item"><a class="nav-link" href="https://www.ussailing.org/competition/small-boat-racing/match-racing/match-racing-calendar">Match Racing</a></li>
          <li class="nav-item"><a class="nav-link" href="https://www.ussailing.org/competition/small-boat-racing/#team-racing">Team Racing</a></li>
          <li class="nav-item"><a class="nav-link" href="https://www.ussailing.org/competition/youth-sailing/junior-olympic-sailing-festival/jo-calendar">Junior Olympic Regattas</a></li>
          <li class="nav-item"><a class="nav-link" href="https://www.ussailing.org/events">US Sailing Meetings</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">Other Links</a>
            <div class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
              <a class="dropdown-item" href="https://www.ussailing.org/membership">Membership</a>
              <a class="dropdown-item" href="https://www1.ussailing.org/constituents/MyUSSailing.aspx">My USSailing</a>
              <a class="dropdown-item" href="https://www.ussailing.org/about/ussf/donate">Donate</a>
              <a class="dropdown-item" href="https://www.ussailing.org/about/our-organization/contact">Contact</a>
            </div>
          </li>
        </ul>
      </div>
    </nav>

    <iframe id="app"
            src="https://ussailing.stagingracingcalendar.org/events?embed=1"
            width="100%" height="700"
            style="border:0; display:block;"
            title="Racing Calendar"
            allow="clipboard-write; fullscreen"></iframe>

  </div>

  <!-- Bootstrap JS: mobile hamburger + "Other Links" dropdown -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.3.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.1/dist/js/bootstrap.min.js"></script>

  <!-- Auto-resize the calendar iframe to its content -->
  <script src="https://ussailing.stagingracingcalendar.org/embed.js" async></script>
</body>
</html>
